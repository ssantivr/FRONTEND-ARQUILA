name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, types, tests and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check lint and formatting
        run: |
          npm run format:check
          npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Check the contrast of the design tokens
        run: npm run contraste
      - name: Run tests with coverage thresholds
        run: npm run test:cobertura
      - name: Check types and build
        run: npm run build

  e2e:
    name: Browser flows (Playwright)
    runs-on: ubuntu-latest
    needs: frontend
    env:
      E2E_CANAL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Run the browser flows
        run: npm run test:e2e
      - name: Keep the report when a flow fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
